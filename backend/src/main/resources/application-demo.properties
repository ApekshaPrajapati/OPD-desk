# Fast local demo profile: no Docker or MySQL server required.
spring.datasource.url=jdbc:h2:mem:opd_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Local debugging only: include the exception details in demo-profile error responses.
server.error.include-message=always
server.error.include-stacktrace=always
