spring.application.name=opd-mini
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/opd_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:opd_user}
spring.datasource.password=${DB_PASSWORD:opd_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
