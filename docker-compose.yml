services:
  mysql:
    image: mysql:8.0
    container_name: opd-mysql
    environment:
      MYSQL_DATABASE: opd_db
      MYSQL_USER: opd_user
      MYSQL_PASSWORD: opd_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - opd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  opd_mysql_data:
